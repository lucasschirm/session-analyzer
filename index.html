<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Analyzer - Agentic Coding Sessions Dashboard</title>
  <meta name="description" content="Offline dashboard for visualizing and managing AI coding sessions from Claude, Agentic Pi, Antigravity, and more." />
  <style>
    :root {
      --md-sys-color-background: #fafafa;
      --md-sys-color-on-background: #1a1a1a;
      --md-sys-color-surface: #ffffff;
      --md-sys-color-surface-container: #f5f5f5;
      --md-sys-color-surface-container-hover: #e8e8e8;
      --md-sys-color-primary: #1976d2;
      --md-sys-color-primary-dark: #1565c0;
      --md-sys-color-primary-container: #bbdefb;
      --md-sys-color-on-primary-container: #0d47a1;
      --md-sys-color-secondary-container: #e8eaf6;
      --md-sys-color-on-secondary-container: #1a237e;
      --md-sys-color-outline: #e0e0e0;
      --md-sys-color-on-surface: #1a1a1a;
      --md-sys-color-on-surface-variant: #666666;
      --md-sys-color-error-container: #ffcdd2;
      --md-sys-color-on-error-container: #b71c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      line-height: 1.5;
    }

    #app {
      min-height: 100vh;
    }

    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--md-sys-color-outline);
      border-top-color: var(--md-sys-color-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <p>Loading Session Analyzer...</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
