name: Claude Plugin CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/plugins/claude-session-sync/**'
      - 'packages/sync/**'
      - 'packages/sync-core/**'
      - '.github/workflows/claude-plugin-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build claude plugin and its workspace dependencies
        run: pnpm --filter @lucasschirm/claude-session-sync... build

      - name: Pack the package
        working-directory: packages/plugins/claude-session-sync
        run: npm pack

      - name: Smoke test the packaged bins
        working-directory: packages/plugins/claude-session-sync
        run: |
          set -e
          tarball=$(ls -t lucasschirm-claude-session-sync-*.tgz | head -n 1)
          tarball_path="$(pwd)/${tarball}"
          smoke_dir=$(mktemp -d)
          (
            cd "${smoke_dir}"
            npm install --omit=dev --no-audit --no-fund "${tarball_path}"
            ./node_modules/.bin/claude-sync -v
            ./node_modules/.bin/claude-session-sync -v
          )

      # Regression coverage for #274: with no SAL_STORAGE_* config, `list`
      # and `sync` must fail loudly (exit 1, "required ... configuration is
      # missing" on stdout/stderr) — not silently exit 0 with no output.
      # claude-sync was never observed exhibiting the #274 bug, but this
      # exercises the actual packaged esbuild bundle (not the exported TS
      # function via vitest) so a future change to the shared
      # `packages/sync` barrel can't silently regress it. `-v` alone does
      # not reach the vulnerable code path.
      - name: Smoke test missing-config error handling (list/sync)
        working-directory: packages/plugins/claude-session-sync
        run: |
          set -e
          tarball=$(ls -t lucasschirm-claude-session-sync-*.tgz | head -n 1)
          tarball_path="$(pwd)/${tarball}"
          smoke_dir=$(mktemp -d)
          (
            cd "${smoke_dir}"
            npm install --omit=dev --no-audit --no-fund "${tarball_path}"

            assert_fails_with_missing_config() {
              local label="$1"
              shift
              set +e
              output=$(env -u SAL_STORAGE_TYPE -u SAL_STORAGE_BUCKET -u SAL_STORAGE_REGION \
                -u SAL_STORAGE_ACCESS_KEY_ID -u SAL_STORAGE_SECRET_ACCESS_KEY -u SAL_PROJECT_ID \
                "$@" 2>&1)
              code=$?
              set -e
              echo "${output}"
              if [ "${code}" -eq 0 ]; then
                echo "FAIL: ${label} exited 0 (expected 1) — silent no-op regression (#274)"
                exit 1
              fi
              if ! echo "${output}" | grep -qi "required.*configuration is missing"; then
                echo "FAIL: ${label} did not print the expected missing-config error"
                exit 1
              fi
              echo "PASS: ${label} exited ${code} with the expected error"
            }

            assert_fails_with_missing_config "claude-sync list" ./node_modules/.bin/claude-sync list
            assert_fails_with_missing_config "claude-sync sync" ./node_modules/.bin/claude-sync sync
          )
