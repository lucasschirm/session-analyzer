name: Test

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm -r lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library dist (needed for downstream typechecks)
        # Build all publishable library packages in topological parallel order,
        # excluding the plugin (esbuild bundle) and site (Vite production build)
        # whose dist output is not consumed by any typecheck target.
        run: pnpm -r --filter '!site' --filter '!@lucasschirm/claude-session-sync' build

      - name: Typecheck all packages
        run: pnpm -r typecheck

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages (including plugin bundle)
        run: pnpm -r build

      # Runs `test:coverage` for every workspace package that defines it, so
      # newly added packages are covered automatically without editing this
      # workflow. See issue #132.
      #
      # Sequential (not --parallel): running all 8 packages' vitest suites
      # concurrently causes CPU contention that intermittently times out
      # slower tests (db's perf/pipeline suites, sync's watcher tests) with a
      # different test failing each run - not a shared-state bug, just
      # resource pressure. Sequential execution is reliable and still
      # completes in well under a minute locally.
      - name: Run unit tests with coverage for all packages
        run: pnpm -r run test:coverage
        env:
          CI: true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-node-${{ matrix.node-version }}
          path: |
            packages/parsers/claude-session-parser/coverage/
            packages/sync/coverage/
            packages/plugins/claude-session-sync/coverage/
            packages/site/coverage/
            packages/db-core/coverage/
            packages/db/coverage/
            packages/transformer/coverage/
            packages/sync-core/coverage/
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages (including plugin bundle)
        run: pnpm -r build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers and system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter site exec playwright install chromium --with-deps

      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter site exec playwright install-deps chromium

      # Runs `test:e2e` for every workspace package that defines it (today
      # just `site`), so a future package's own e2e suite is picked up
      # automatically without editing this workflow. Sequential for the same
      # contention reasons as the unit test job above.
      - name: Run e2e tests for all packages
        run: pnpm -r run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/site/playwright-report/
          retention-days: 30
