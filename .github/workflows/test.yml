name: Test

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm --filter site... build

      - name: Run claude-session-parser tests (Vitest, with coverage)
        run: pnpm --filter @lucasschirm/sal-claude-session-parser test:coverage
        env:
          CI: true

      - name: Run site unit tests (Vitest, with coverage)
        run: pnpm --filter site test:coverage
        env:
          CI: true

      - name: Install Playwright browsers
        run: pnpm --filter site exec playwright install chromium --with-deps

      - name: Run E2E tests (Playwright)
        run: pnpm --filter site test:e2e
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/site/playwright-report/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/site/coverage/
          retention-days: 30
