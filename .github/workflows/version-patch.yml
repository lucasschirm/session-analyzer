name: Version Patch

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  version-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm --filter @lucasschirm/claude-session-sync... build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump plugin patch version
        run: pnpm run version:patch

      - name: Commit and push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit --no-verify -m "chore: bump @lucasschirm/claude-session-sync patch version [skip ci]"
            git push
          fi

      - name: Publish packages
        run: |
          set +e
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            output=$(pnpm run version:publish 2>&1)
            status=$?
            echo "$output"
            if [ $status -eq 0 ]; then
              exit 0
            fi
            if echo "$output" | grep -qi "cannot publish over\|previously published"; then
              echo "Version already published on npm; treating as success."
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::pnpm run version:publish failed after $max_attempts attempts"
              exit $status
            fi
            echo "::warning::Publish attempt $attempt failed (exit $status); retrying in 15s..."
            sleep 15
          done
