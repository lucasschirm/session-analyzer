name: Version Patch

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  version-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}

      # ref: main (not the trigger SHA) so re-runs see the branch as it is now,
      # including the [skip ci] bump commit a previous attempt may have pushed.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Node 24 ships npm >= 11.5.1, required for npm trusted publishing (OIDC).
      # Node 22's npm 10 cannot mint a registry token, and the registry answers
      # the unauthenticated PUT with a misleading 404.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin workspace dependencies
        run: pnpm --filter @lucasschirm/claude-session-sync... --filter @lucasschirm/devin-session-sync... build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Align both plugins to the higher of their two versions before
      # bumping/publishing. A manual edit or a divergent starting version
      # (e.g. devin-session-sync shipped at 0.1.0 while claude-session-sync
      # was already at 0.2.39) can drift them; this converges them so the
      # bump and publish always land on the same version for both plugins.
      - name: Align plugin versions
        run: node scripts/align-plugin-versions.mjs

      # Only bump when the current version already exists on npm. If a previous
      # run bumped but failed to publish, this run publishes that version
      # instead of widening the gap, and re-runs become idempotent.
      - name: Bump plugin patch versions
        run: |
          claude_current=$(node -p "require('./packages/plugins/claude-session-sync/package.json').version")
          devin_current=$(node -p "require('./packages/plugins/devin-session-sync/package.json').version")
          claude_published=false
          devin_published=false
          if npm view "@lucasschirm/claude-session-sync@${claude_current}" version >/dev/null 2>&1; then
            claude_published=true
          fi
          if npm view "@lucasschirm/devin-session-sync@${devin_current}" version >/dev/null 2>&1; then
            devin_published=true
          fi
          if [ "$claude_published" = "true" ] && [ "$devin_published" = "true" ]; then
            pnpm run version:patch
          else
            echo "One or more plugin versions are not on npm yet (claude=${claude_current}, devin=${devin_current}); publishing current versions without bumping."
          fi

      # If main moved while this job ran (concurrent merge already pushed a
      # bump), drop our local bump and publish from the remote state instead of
      # failing; both runs converge on the same version and the duplicate
      # publish resolves as already-published below.
      - name: Commit and push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit --no-verify -m "chore: bump plugin patch versions [skip ci]"
            if ! git push; then
              echo "Push rejected (main moved concurrently); publishing from remote main state instead."
              git fetch origin main
              git reset --hard FETCH_HEAD
            fi
          fi

      - name: Publish packages
        run: node scripts/publish-packages.mjs
